name: Build (macOS, Windows, Linux)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Core self-test
        run: node tools/test/selftest.mjs

  mac:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Build app bundles (Apple Silicon + Intel)
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
        run: npx electron-builder --mac --arm64 --x64 --publish never
      - name: Ad-hoc sign, DMG per architecture (LZMA)
        run: |
          VER=$(node -p "require('./package.json').version")
          for pair in "mac-arm64:arm64" "mac:x64"; do
            DIR="${pair%%:*}"; ARCH="${pair##*:}"; APP="dist/$DIR/mod2sid.app"
            codesign --force --deep --sign - "$APP"
            rm -rf dmgroot && mkdir dmgroot && cp -R "$APP" dmgroot/ && ln -s /Applications dmgroot/Applications
            for try in 1 2 3; do hdiutil create -volname "mod2sid $VER" -srcfolder dmgroot -ov -format ULMO "dist/mod2sid-$VER-mac-$ARCH.dmg" && break; echo "hdiutil busy, retry $try"; sleep 15; [ $try = 3 ] && exit 1; done
          done
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: mod2sid-macos
          path: dist/*.dmg

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Build installer + portable
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
        run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: mod2sid-windows
          path: dist/*.exe

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Build AppImage + deb
        run: npx electron-builder --linux --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: mod2sid-linux
          path: |
            dist/*.AppImage
            dist/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: gh release create "$GITHUB_REF_NAME" out/* --title "mod2sid $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md || gh release upload "$GITHUB_REF_NAME" out/* --clobber
