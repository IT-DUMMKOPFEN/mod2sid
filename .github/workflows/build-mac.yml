name: Build macOS (Apple Silicon)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Core self-test (synthetic MOD)
        run: node tools/test/selftest.mjs
      - name: Build app bundle
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dir --arm64 --publish never
      - name: Ad-hoc sign, create DMG + ZIP
        run: |
          APP="dist/mac-arm64/mod2sid.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          VER=$(node -p "require('./package.json').version")
          mkdir -p dmgroot && cp -R "$APP" dmgroot/ && ln -s /Applications dmgroot/Applications
          hdiutil create -volname "mod2sid $VER" -srcfolder dmgroot -ov -format UDZO "dist/mod2sid-$VER-arm64.dmg"
          ditto -c -k --keepParent "$APP" "dist/mod2sid-$VER-arm64-mac.zip"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: mod2sid-macos-arm64
          path: |
            dist/*.dmg
            dist/*.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.dmg dist/*.zip --title "mod2sid ${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md || gh release upload "${GITHUB_REF_NAME}" dist/*.dmg dist/*.zip --clobber
